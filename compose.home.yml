services:
  mysql:
    image: mysql:8.4
    restart: "no"
    environment:
      MYSQL_DATABASE: pruefversand
      MYSQL_USER: pruefversand_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Définir MYSQL_PASSWORD dans .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Définir MYSQL_ROOT_PASSWORD dans .env}
      TZ: UTC
    ports:
      - '127.0.0.1:${PRUEFVERSAND_MYSQL_PORT:-3307}:3306'
    volumes:
      - pruefversand_mysql_data:/var/lib/mysql
      - ./sql/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./sql/migrations/002_scan_observation.sql:/docker-entrypoint-initdb.d/002_scan_observation.sql:ro
      - ./sql/migrations/003_manual_review_decision.sql:/docker-entrypoint-initdb.d/003_manual_review_decision.sql:ro
      - ./sql/migrations/004_versand_review_decision.sql:/docker-entrypoint-initdb.d/004_versand_review_decision.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pruefversand_mysql_data:
